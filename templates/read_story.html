
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Story | Ghost of Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            padding: 30px;
            line-height: 1.8;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
        }

        a {
            color: #60a5fa;
        }

        .story-content h1,
        .story-content h2,
        .story-content h3 {
            color: #60a5fa;
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="{{ url_for('saved_stories') }}">← Back to Library</a>

        <h1>👻 Ghost of Code</h1>

        <div class="story-content">
            {{ story_html | safe }}
        </div>

    </div>

</body>
</html>
